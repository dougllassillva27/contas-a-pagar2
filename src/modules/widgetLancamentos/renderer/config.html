<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Widget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="modal-container" style="width: 388px;">
    <header class="modal-header">
      <h1>Configurações</h1>
      <button type="button" class="btn-close" id="btnClose" title="Fechar (Esc)">&times;</button>
    </header>
    <form id="configForm" class="lancamento-form" novalidate>
      <div class="form-group">
        <label for="hotkey">Atalho Global de Acesso *</label>
        <input type="text" id="hotkey" name="hotkey" required readonly placeholder="Pressione o novo atalho..." title="Clique aqui e pressione as teclas do novo atalho (Ex: Ctrl+Alt+N)">
        <small class="help-text">Clique no campo e digite seu atalho preferido (ex: Ctrl+Alt+N). Capturamos as teclas dinamicamente.</small>
        <span class="error-msg" id="error-hotkey"></span>
      </div>
      
      <!-- Iniciar com o Windows Premium Toggle Slider -->
      <div class="form-group flex-row justify-between align-center py-2">
        <div>
          <label class="mb-0" style="cursor: pointer;" for="autoStart">Iniciar com o Windows</label>
          <small class="help-text block">Ativar inicialização automática do widget ao ligar o computador.</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoStart" name="autoStart">
          <span class="slider round"></span>
        </label>
      </div>

      <!-- Fechar automaticamente após sucesso -->
      <div class="form-group flex-row justify-between align-center py-2">
        <div>
          <label class="mb-0" style="cursor: pointer;" for="autoCloseOnSuccess">Fechar após lançamento</label>
          <small class="help-text block">Fecha o widget automaticamente após confirmar um lançamento com sucesso.</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoCloseOnSuccess" name="autoCloseOnSuccess">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="form-actions mt-4">
        <button type="submit" class="btn-primary" id="btnSubmit">Salvar Configurações</button>
      </div>
      
      <div class="loading-overlay hidden" id="loading">
        <div class="spinner"></div><span>Salvando...</span>
      </div>
    </form>
    
    <div class="status-overlay hidden" id="statusMessage">
      <div class="status-message-content" id="statusMessageText"></div>
    </div>
  </div>
  <script src="config.js"></script>
</body>
</html>
