<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Lancamentos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="modal-container">
    <header class="modal-header">
      <h1>Novo Lançamento</h1>
      <button type="button" class="btn-close" id="btnClose" title="Fechar (Esc)">&times;</button>
    </header>
    <form id="lancamentoForm" class="lancamento-form" novalidate>
      <fieldset class="user-selector">
        <legend>Usuário</legend>
        <div class="user-buttons">
          <button type="button" class="user-btn active" data-user-id="1" id="btnDodo">Dodo</button>
          <button type="button" class="user-btn" data-user-id="2" id="btnVitoria">Vitória</button>
        </div>
        <input type="hidden" id="usuario_id" name="usuario_id" value="1">
      </fieldset>
      <div class="form-group">
        <label for="descricao">Descrição *</label>
        <input type="text" id="descricao" name="descricao" required maxlength="255" placeholder="Ex: Netflix">
        <span class="error-msg" id="error-descricao"></span>
      </div>
      <div class="form-group">
        <label for="valor">Valor *</label>
        <input type="text" id="valor" name="valor" required placeholder="R$ 0,00">
        <span class="error-msg" id="error-valor"></span>
      </div>
      <fieldset class="user-selector form-group">
        <legend>Tipo de Conta *</legend>
        <div class="user-buttons">
          <button type="button" class="user-btn" id="btnFixa">Fixa</button>
          <button type="button" class="user-btn active" id="btnUnica">Única</button>
          <button type="button" class="user-btn" id="btnParcelada">Parcelada</button>
        </div>
        <input type="hidden" id="tipo" name="tipo" value="unica">
        <span class="error-msg" id="error-tipo"></span>
      </fieldset>
      <div class="form-group hidden" id="parcelasGroup">
        <label for="parcelas">Parcelas</label>
        <input type="text" id="parcelas" name="parcelas" placeholder="Ex: 10 ou 1/10">
        <small>Deixe em branco para à vista</small>
      </div>
      <div class="form-group">
        <label for="terceiro">Terceiro (opcional)</label>
        <input type="text" id="terceiro" name="terceiro" maxlength="100" placeholder="Ex: Eu, Morr, Casa (use vírgulas para lote)">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="btnSubmit">Salvar</button>
      </div>
      <div class="loading-overlay hidden" id="loading"><div class="spinner"></div><span>Enviando...</span></div>
    </form>
    <div class="status-overlay hidden" id="statusMessage">
      <div class="status-message-content" id="statusMessageText"></div>
    </div>
  </div>
  <script src="form.js"></script>
</body>
</html>
